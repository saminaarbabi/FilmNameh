<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند فیلمنامه‌نویس</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a2e;
            --surface-color: #16213e;
            --primary-color: #0f3460;
            --secondary-color: #e94560;
            --text-color: #dcdcdc;
            --font-family: 'Vazirmatn', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center; /* ✨ این خط برای وسط‌چین عمودی اصلاح شد */
            min-height: 100vh;
            box-sizing: border-box; /* برای محاسبه صحیح padding */
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--primary-color);
        }

        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 700; color: white; margin: 0; }
        .header h1 span { background: linear-gradient(90deg, #a259ff, var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-fill-color: transparent; }
        .header p { font-size: 1.1rem; font-weight: 300; color: var(--text-color); margin-top: 0.5rem; }
        textarea { width: 90%; max-width: 700px; height: 150px; padding: 1rem; border-radius: 10px; border: 2px solid var(--primary-color); background-color: var(--bg-color); color: white; font-size: 1rem; font-family: var(--font-family); resize: vertical; box-sizing: border-box; margin: 0 auto 1.5rem auto; display: block; transition: border-color 0.3s, box-shadow 0.3s; }
        textarea:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 15px rgba(233, 69, 96, 0.3); }
        .button-container { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
        button { width: 180px; max-width: 100%; padding: 1rem; font-size: 1.2rem; font-weight: 600; font-family: var(--font-family); color: white; border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        #submit-btn { background: linear-gradient(90deg, #a259ff, var(--secondary-color)); }
        #stop-btn { background-color: #6c757d; display: none; }
        button svg { width: 24px; height: 24px; }
        button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
        .loader { display: none; text-align: center; margin: 2rem 0; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.2); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--secondary-color); animation: spin 1s ease infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #results { margin-top: 2.5rem; display: none; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-card { background-color: var(--primary-color); border-radius: 10px; padding: 1.5rem; }
        .result-card h2 { color: white; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.75rem; margin-top: 0; margin-bottom: 1.5rem; }
        pre { white-space: pre-wrap; word-wrap: break-word; background-color: var(--bg-color); padding: 1.5rem; border-radius: 8px; color: var(--text-color); font-family: 'Vazirmatn', monospace; line-height: 1.7; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>دستیار <span>فیلمنامه‌نویس</span></h1>
            <p>ایده خود را به یک سکانس درخشان تبدیل کنید یا سوالات خود را بپرسید</p>
        </div>
        
        <form id="script-form">
            <textarea 
                id="user-prompt" 
                placeholder="ایده خود را اینجا بنویسید..." 
                required 
                minlength="10"></textarea>
            
            <div class="button-container">
                <button id="submit-btn" type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                    <span>تایید</span>
                </button>
                <button id="stop-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z" />
                    </svg>
                    <span>توقف</span>
                </button>
            </div>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>در حال نوشتن... لطفاً کمی صبر کنید!</p>
        </div>

        <div id="results">
            <div class="result-card">
                <h2> خروجی نهایی</h2>
                <pre id="generated-script"></pre>
            </div>
        </div>
    </div>

    <script>
        // ... کدهای JavaScript بدون تغییر باقی می‌مانند ...
        const form = document.getElementById('script-form');
        const userPromptInput = document.getElementById('user-prompt');
        const submitBtn = document.getElementById('submit-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultsDiv = document.getElementById('results');
        const generatedScriptPre = document.getElementById('generated-script');
        const loader = document.getElementById('loader');

        let controller;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = userPromptInput.value;
            
            controller = new AbortController();
            const signal = controller.signal;
            
            submitBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            loader.style.display = 'block';
            resultsDiv.style.display = 'none';
            generatedScriptPre.textContent = '';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/generate-stream/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }),
                    signal: signal 
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'خطا در ارتباط با سرور');
                }

                resultsDiv.style.display = 'block';
                loader.style.display = 'none';

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    generatedScriptPre.textContent += chunk; 
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Generation stopped by user.');
                    generatedScriptPre.textContent += "\n\n-- عملیات توسط کاربر متوقف شد --";
                } else {
                    console.error('Error:', error);
                    generatedScriptPre.textContent = `متاسفانه خطایی رخ داد: \n${error.message}`;
                }
                resultsDiv.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                submitBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (controller) {
                controller.abort();
            }
        });
    </script>
</body>
</html>
